server {
    listen 80;
    server_name your-domain.com; # Replace with your actual domain or IP

    # Route requests to the Frontend Container
    location / {
        proxy_pass http://<APPLICATION_SERVER_IP>:5011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_addrs;
    }

    # Route API requests to the Backend Container
    location /api/ {
        # Depending on how your backend expects the URL, 
        # you might need to strip the /api/ prefix:
        # rewrite ^/api/?(.*) /$1 break;
        
        proxy_pass http://<APPLICATION_SERVER_IP>:5010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_addrs;
    }
}
