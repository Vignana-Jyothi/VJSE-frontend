version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vjse_backend
    ports:
      - "5010:3000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./VJSE-frontend
      dockerfile: Dockerfile
    container_name: vjse_frontend
    ports:
      - "5011:80"
    restart: unless-stopped
